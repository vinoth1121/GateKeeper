name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B -ntp verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: surefire-reports, path: gateway/target/surefire-reports}
      - run: docker build -t gatekeeper-gateway -f gateway/Dockerfile .
  lint:
    runs-on: ubuntu-latest
    steps: [{uses: actions/checkout@v4}, {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: '21', cache: maven}}, {run: mvn -B spotless:check}]
  dependency-scan:
    runs-on: ubuntu-latest
    steps: [{uses: actions/checkout@v4}, {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: '21', cache: maven}}, {run: mvn -B dependency-check:check || true}, {if: always(), uses: actions/upload-artifact@v4, with: {name: dependency-check, path: '**/target/dependency-check-report.html'}}]
  chaos:
    runs-on: ubuntu-latest
    steps: [{uses: actions/checkout@v4}, {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: '21', cache: maven}}, {run: mvn -B test -Pchaos, timeout-minutes: 30}]